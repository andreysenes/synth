<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 110" width="160mm" height="110mm">
  <defs>
    <radialGradient id="alum" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#f4f4f2"/>
      <stop offset="45%" stop-color="#c8c8c6"/>
      <stop offset="100%" stop-color="#8e8e8c"/>
    </radialGradient>
    <radialGradient id="led-red" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#ff8a7a"/>
      <stop offset="40%" stop-color="#e02020"/>
      <stop offset="100%" stop-color="#6a0000"/>
    </radialGradient>
    <radialGradient id="gold" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f0d48a"/>
      <stop offset="100%" stop-color="#8a6a20"/>
    </radialGradient>
    <radialGradient id="knob-body" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="55%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>

    <g id="ticks-lg">
      <g fill="none" stroke="#f2f2f0" stroke-width="0.32" stroke-linecap="round">
        <line transform="rotate(-135)" x1="0" y1="-17.4" x2="0" y2="-20.2"/>
        <line transform="rotate(-90)" x1="0" y1="-17.4" x2="0" y2="-19.2"/>
        <line transform="rotate(-45)" x1="0" y1="-17.4" x2="0" y2="-19.2"/>
        <line transform="rotate(0)" x1="0" y1="-17.4" x2="0" y2="-20.2"/>
        <line transform="rotate(45)" x1="0" y1="-17.4" x2="0" y2="-19.2"/>
        <line transform="rotate(90)" x1="0" y1="-17.4" x2="0" y2="-19.2"/>
        <line transform="rotate(135)" x1="0" y1="-17.4" x2="0" y2="-20.2"/>
      </g>
    </g>
    <g id="ticks-sm">
      <g fill="none" stroke="#f2f2f0" stroke-width="0.24" stroke-linecap="round">
        <line transform="rotate(-135)" x1="0" y1="-9.2" x2="0" y2="-11.2"/>
        <line transform="rotate(-90)" x1="0" y1="-9.2" x2="0" y2="-10.5"/>
        <line transform="rotate(-45)" x1="0" y1="-9.2" x2="0" y2="-10.5"/>
        <line transform="rotate(0)" x1="0" y1="-9.2" x2="0" y2="-11.2"/>
        <line transform="rotate(45)" x1="0" y1="-9.2" x2="0" y2="-10.5"/>
        <line transform="rotate(90)" x1="0" y1="-9.2" x2="0" y2="-10.5"/>
        <line transform="rotate(135)" x1="0" y1="-9.2" x2="0" y2="-11.2"/>
      </g>
    </g>

    <g id="knob-lg">
      <circle cy="0.55" r="15.1" fill="#000" opacity="0.18"/>
      <circle r="15" fill="#0c0c0c" stroke="#4a4a4a" stroke-width="0.35"/>
      <circle r="13.1" fill="url(#knob-body)"/>
      <circle r="9.6" fill="#141414"/>
      <circle r="7.3" fill="url(#alum)"/>
      <circle r="7.3" fill="none" stroke="#9a9a98" stroke-width="0.18"/>
      <circle cx="0" cy="11" r="0.8" fill="#f2f2f0"/>
    </g>
    <g id="knob-sm">
      <circle cy="0.3" r="7.55" fill="#000" opacity="0.18"/>
      <circle r="7.5" fill="#0c0c0c" stroke="#4a4a4a" stroke-width="0.3"/>
      <circle r="6.5" fill="url(#knob-body)"/>
      <circle r="4.8" fill="#141414"/>
      <circle r="3.65" fill="url(#alum)"/>
      <circle cx="0" cy="5.5" r="0.42" fill="#f2f2f0"/>
    </g>
    <g id="led">
      <circle r="2.15" fill="#4a1010"/>
      <circle r="1.55" fill="url(#led-red)"/>
      <circle cx="-0.45" cy="-0.5" r="0.45" fill="#fff" opacity="0.45"/>
    </g>
    <g id="jack">
      <polygon points="0,-4.4 3.81,-2.2 3.81,2.2 0,4.4 -3.81,2.2 -3.81,-2.2" fill="#c8c8c6"/>
      <circle r="3.7" fill="#1a1a1a"/>
      <circle r="2.55" fill="#111"/>
      <circle r="1.55" fill="url(#gold)"/>
      <circle r="1.05" fill="#1a1208"/>
    </g>
    <g id="p4">
      <circle r="6.3" fill="#2c2c2c"/>
      <circle r="5.5" fill="#3a3a3a"/>
      <circle r="3.5" fill="#111"/>
      <circle r="1.55" fill="#c8c8c6"/>
      <circle r="0.75" fill="#1a1a1a"/>
    </g>
  </defs>

  <style>
    .panel { fill: #111111; }
    .lab { fill: #f4f4f2; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 2.5px; font-weight: 600; text-anchor: middle; }
    .sub { fill: #f4f4f2; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 2.1px; text-anchor: middle; }
    .rule { fill: none; stroke: #f4f4f2; stroke-width: 0.3; }
  </style>

  <rect class="panel" width="160" height="110"/>
  <rect class="rule" x="6" y="6" width="148" height="98"/>

  <text class="lab" x="78" y="14">VCO</text>

  <g transform="translate(16,20)"><use href="#led"/></g>
  <text class="sub" x="16" y="27">LED</text>

  <g transform="translate(36,20)"><use href="#p4"/></g>
  <text class="lab" x="36" y="32">9V</text>

  <g transform="translate(122,32)">
    <use href="#ticks-lg"/>
    <use href="#knob-lg"/>
  </g>
  <text class="lab" x="122" y="54">COARSE</text>

  <g transform="translate(28,68)">
    <use href="#ticks-sm"/>
    <use href="#knob-sm"/>
  </g>
  <text class="lab" x="28" y="82">FINE</text>

  <g transform="translate(62,68)">
    <use href="#ticks-sm"/>
    <use href="#knob-sm"/>
  </g>
  <text class="lab" x="62" y="82">PW</text>

  <g transform="translate(96,68)">
    <use href="#ticks-sm"/>
    <use href="#knob-sm"/>
  </g>
  <text class="lab" x="96" y="82">FM</text>

  <g transform="translate(18,94)"><use href="#jack"/></g>
  <text class="lab" x="18" y="104">CV</text>

  <g transform="translate(44,94)"><use href="#jack"/></g>
  <text class="lab" x="44" y="104">FM</text>

  <g transform="translate(80,94)"><use href="#jack"/></g>
  <text class="lab" x="80" y="104">SAW</text>

  <g transform="translate(108,94)"><use href="#jack"/></g>
  <text class="lab" x="108" y="104">TRI</text>

  <g transform="translate(136,94)"><use href="#jack"/></g>
  <text class="lab" x="136" y="104">PULSE</text>

  <g fill="none" stroke="#f4f4f2" stroke-width="0.35">
    <circle cx="6" cy="6" r="1.6"/>
    <circle cx="154" cy="6" r="1.6"/>
    <circle cx="6" cy="104" r="1.6"/>
    <circle cx="154" cy="104" r="1.6"/>
  </g>
</svg>
